# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
- name: Setup .NET Core SDK
  uses: actions/setup-dotnet@v6.1.0
  with:
    # Optional SDK version(s) to use. If not provided, will install global.json version when available. Examples: 2.2.104, 3.1, 3.1.x, 3.x, 6.0.2xx, latest
    dotnet-version: # optional
    # Optional quality of the build. The possible values are: daily, preview, ga.
    dotnet-quality: # optional
    # Optional channel for the installation. The possible values are: STS, LTS, A.B (e.g. 8.0), A.B.Cxx (e.g. 8.0.1xx, available since 5.0). To be used with "dotnet-version: latest".
    dotnet-channel: # optional
    # Optional. When true, skips the LTS runtime pre-pass and installs only the requested dotnet-version. Default: false.
    skip-lts-prepass: # optional
    # Optional global.json location, if your global.json isn't located in the root of the repo.
    global-json-file: # optional
    # Optional package source for which to set up authentication. Will consult any existing NuGet.config in the root of the repo and provide a temporary NuGet.config using the NUGET_AUTH_TOKEN environment variable as a ClearTextPassword
    source-url: # optional
    # Optional OWNER for using packages from GitHub Package Registry organizations/users other than the current repository's owner. Only used if a GPR URL is also provided in source-url
    owner: # optional
    # Optional NuGet.config location, if your NuGet.config isn't located in the root of the repo.
    config-file: # optional
    # Optional input to enable caching of the NuGet global-packages folder
    cache: # optional
    # Used to specify the path to a dependency file: packages.lock.json. Supports wildcards or a list of file names for caching multiple dependencies.
    cache-dependency-path: # optional
    # Optional SDK workloads to install for additional platform support. Examples: wasm-tools, maui, aspire.
    workloads: # optional
    # Optional architecture for the .NET install. Supported values: x64, x86, arm64, amd64, arm, s390x, ppc64le, riscv64. If not set, the installer auto-detects the current system architecture.
    architecture: # optional
    # Optional, defaults to true. When false, a locally installed SDK that satisfies the requested version is reused without any network calls, otherwise the latest matching version is installed online. Cross-architecture requests always install online. Falls back to the DOTNET_CHECK_LATEST environment variable when this input is not set.
    check-latest: # optional
    - name: Coder Create Task
  # You may pin to the exact commit or the version.
  # uses: coder/create-task-action@a2f4758e6eb3b2c2aefd0fdd4b062e678e1db703
  uses: coder/create-task-action@v0.0.5
  with:
    # Prompt/instructions to send to the task
    coder-task-prompt: 
    # Coder session token for authentication
    coder-token: 
    # Coder deployment URL
    coder-url: 
    # Coder template to use for workspace
    coder-template-name: 
    # GitHub issue URL to link this task to
    github-issue-url: 
    # GitHub token for API operations
    github-token: 
    # GitHub user ID to create task for. If provided, `coder-username` must not be set.
    github-user-id: # optional
    # Coder username to create task for. If provided, github-user-id must not be set. Useful for automated workflows without a triggering user.
    coder-username: # optional
    # Coder organization name
    coder-organization: # optional, default is default
    # Prefix for task name
    coder-task-name-prefix: # optional, default is gh
    # Template preset to use (optional)
    coder-template-preset: # optional
    # Whether to comment on the GitHub issue
    comment-on-issue: # optional, default is true
    - name: Add To GitHub projects
  uses: actions/add-to-project@v2.0.0
  with:
    # URL of the project to add issues to
    project-url: 
    # A GitHub personal access token with write access to the project
    github-token: 
    # A comma-separated list of labels to use as a filter for issue to be added
    labeled: # optional
    # The behavior of the labels filter, AND to match all labels, OR to match any label, NOT to exclude any listed label (default is OR)
    label-operator: # optional
    - name: Source to Image Build
  # You may pin to the exact commit or the version.
  # uses: redhat-actions/s2i-build@1436d4468ca4dde2a6c85faaae0cb3864f5ffe70
  uses: redhat-actions/s2i-build@v2
  with:
    # The path of the s2i builder image.
    builder_image: 
    # The Name of the image to build
    image: 
    # The tags of the image to build. For multiple tags, seperate by a space. For example, "latest v1".
    tags: # optional, default is latest
    # The location of the path to run s2i from
    path_context: # optional, default is .
    # Log level when running the S2I
    log_level: # optional, default is 1
    # List of environment variable key-value pairs to pass to the s2i builder context
    env_vars: # optional
    # Include all files in tar during build which includes .git directory
    include_git: # optional, default is false
    - name: trunk breakpoint
  # You may pin to the exact commit or the version.
  # uses: trunk-io/breakpoint@28dd52b1ad98f85fa7217bcc142bae2459aed159
  uses: trunk-io/breakpoint@v1.3.0
  with:
    # Which breakpoint to trigger
    breakpoint-id: 
    # Which command to run
    run: 
    # API key for trunk. Should be in your secrets
    trunk-token: 
    # Add debug level logs
    debug: # optional
    # Which shell to run with
    shell: # optional, default is bash
    # Which organization the breakpoint is associated with
    org: # optional
    # Path to Trunk Launcher. If not provided, we'll look for it the repo root, `.trunk/bin` and `tools/`. If it can't be found anywhere and is not provided explicitly, we'll download it on demand.
    trunk-path: # optional
    # Working directory of breakpoint
    working-directory: # optional, default is ./
    - name: Git Submodule Status Commenter
  # You may pin to the exact commit or the version.
  # uses: rematocorp/submodule-status-commenter@f1c44c4e1c38524d7b1307b343692b31563244e3
  uses: rematocorp/submodule-status-commenter@v3.0.0
  with:
    # GitHub token, https://docs.github.com/en/actions/reference/authentication-in-a-workflow.
    github-token: 
    - name: Rebuild Armbian
  uses: armbian/build@v26.11.0-trunk.118
  - name: Publish all Release
  uses: thomas-iniguez-visioli/publish-release@0.0.4
  - name: SSH Remote Commands
  uses: appleboy/ssh-action@v1.2.5
  - name: Coder Create Task
  # You may pin to the exact commit or the version.
  # uses: coder/create-task-action@a2f4758e6eb3b2c2aefd0fdd4b062e678e1db703
  uses: coder/create-task-action@v0.0.5
  with:
    # Prompt/instructions to send to the task
    coder-task-prompt: 
    # Coder session token for authentication
    coder-token: 
    # Coder deployment URL
    coder-url: 
    # Coder template to use for workspace
    coder-template-name: 
    # GitHub issue URL to link this task to
    github-issue-url: 
    # GitHub token for API operations
    github-token: 
    # GitHub user ID to create task for. If provided, `coder-username` must not be set.
    github-user-id: # optional
    # Coder username to create task for. If provided, github-user-id must not be set. Useful for automated workflows without a triggering user.
    coder-username: # optional
    # Coder organization name
    coder-organization: # optional, default is default
    # Prefix for task name
    coder-task-name-prefix: # optional, default is gh
    # Template preset to use (optional)
    coder-template-preset: # optional
    # Whether to comment on the GitHub issue
    comment-on-issue: # optional, default is true
